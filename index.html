<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tender Package Builder</title>
  <meta name="description" content="Assemble a complete, checked tender bid package in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fileselect.css">
  <link rel="stylesheet" href="css/datepicker.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="app.skip">Skip to main content</a>
  <div id="file-banner" class="banner banner-warn" hidden role="alert"></div>
  <script>
    // Classic script: works even from file:// where ES modules are blocked.
    (function () {
      if (location.protocol !== 'file:') return;
      var lang = 'en';
      try { if (localStorage.getItem('lang') === 'bn') lang = 'bn'; } catch (e) {}
      var msg = lang === 'bn'
        ? 'এই অ্যাপটি সরাসরি ফাইল হিসেবে খুললে কাজ করবে না। লাইভ ওয়েবসাইটটি ব্যবহার করুন, অথবা এই ফোল্ডারে "python3 -m http.server" চালিয়ে http://localhost:8000 খুলুন।'
        : 'This app does not work when opened directly as a file. Use the live website, or run "python3 -m http.server" in this folder and open http://localhost:8000.';
      var b = document.getElementById('file-banner');
      b.textContent = msg; b.hidden = false;
      document.documentElement.lang = lang;
    })();
  </script>

  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <h1 data-i18n="app.title">Tender Package Builder</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
      <div class="lang" role="group" data-i18n-aria="lang.label">
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="true" lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="bn" aria-pressed="false" lang="bn">বাংলা</button>
      </div>
    </div>
    <div class="wrap">
      <p class="sr-only" data-i18n="app.steps"></p>
      <nav data-i18n-aria="step.nav">
        <ol class="stepper" id="stepper">
          <li data-step="1"><a href="#h-req"><span class="step-dot" aria-hidden="true">1</span><span data-i18n="step.1"></span> <span class="sr-only step-state"></span></a></li>
          <li data-step="2"><a href="#h-files"><span class="step-dot" aria-hidden="true">2</span><span data-i18n="step.2"></span> <span class="sr-only step-state"></span></a></li>
          <li data-step="3"><a href="#h-check"><span class="step-dot" aria-hidden="true">3</span><span data-i18n="step.3"></span> <span class="sr-only step-state"></span></a></li>
          <li data-step="4"><a href="#h-gen"><span class="step-dot" aria-hidden="true">4</span><span data-i18n="step.4"></span> <span class="sr-only step-state"></span></a></li>
        </ol>
      </nav>
      <p class="privacy" data-i18n="app.privacy"></p>
    </div>
  </header>

  <div id="live" class="sr-only" aria-live="polite" role="status"></div>

  <main id="main" class="wrap">
    <div id="toast" class="toast" hidden></div>

    <!-- 1. Requirements -->
    <section class="card" aria-labelledby="h-req">
      <h2 id="h-req" data-i18n="req.heading"></h2>
      <p class="help" data-i18n="req.help"></p>
      <label class="drop" id="req-drop" for="req-input">
        <span class="drop-icon ico-slot" data-icon="json" data-size="28" aria-hidden="true"></span>
        <span data-i18n="req.drop"></span>
        <input id="req-input" class="visually-hidden-input" type="file" accept=".json,application/json" data-i18n-aria="req.dropAria">
      </label>
      <div class="btn-row">
        <button type="button" id="btn-sample" class="btn" data-i18n-title="req.loadSampleAria"><span class="ico-slot" data-icon="sample" aria-hidden="true"></span><span data-i18n="req.loadSample"></span></button>
        <button type="button" id="btn-reset" class="btn btn-ghost" data-i18n-title="req.resetAria"><span class="ico-slot" data-icon="reset" aria-hidden="true"></span><span data-i18n="req.reset"></span></button>
      </div>
      <div id="req-errors" class="errors" hidden role="alert"></div>
      <div id="tender"></div>
    </section>

    <!-- 2. Files -->
    <section class="card" aria-labelledby="h-files">
      <h2 id="h-files" data-i18n="files.heading"></h2>
      <p class="help" id="files-help"></p>
      <label class="drop" id="files-drop" for="files-input">
        <span class="drop-icon ico-slot" data-icon="pdf" data-size="28" aria-hidden="true"></span>
        <span data-i18n="files.drop"></span>
        <input id="files-input" class="visually-hidden-input" type="file" multiple accept=".pdf,application/pdf" data-i18n-aria="files.dropAria">
      </label>
      <p id="files-busy" class="busy" hidden><span class="spinner" aria-hidden="true"></span><span data-i18n="files.reading"></span></p>
      <div id="rejected"></div>
      <div id="files"></div>
    </section>

    <!-- 3. Checklist -->
    <section class="card" aria-labelledby="h-check">
      <h2 id="h-check" data-i18n="check.heading"></h2>
      <p class="help" data-i18n="check.help"></p>
      <div class="btn-row">
        <button type="button" id="btn-auto" class="btn"><span class="ico-slot" data-icon="auto" aria-hidden="true"></span><span data-i18n="check.autoMatch"></span></button>
        <button type="button" id="btn-csv" class="btn btn-ghost" data-i18n-title="csv.buttonAria"><span class="ico-slot" data-icon="csv" aria-hidden="true"></span><span data-i18n="csv.button"></span></button>
      </div>
      <p id="check-summary" class="summary"></p>
      <div id="checklist"></div>
      <details class="legend" open>
        <summary data-i18n="legend.heading"></summary>
        <ul id="legend"></ul>
      </details>
    </section>

    <!-- 4. Generate -->
    <section class="card" aria-labelledby="h-gen">
      <h2 id="h-gen" data-i18n="gen.heading"></h2>
      <div id="gen-info"></div>
      <label class="check"><input type="checkbox" id="opt-index" checked> <span data-i18n="gen.index"></span></label>
      <details class="seal">
        <summary data-i18n="seal.heading"></summary>
        <p class="help" data-i18n="seal.intro"></p>
        <div class="field">
          <input type="file" id="seal-input" class="visually-hidden-input" accept="image/png" aria-describedby="seal-file-help">
          <label for="seal-input" class="btn seal-pick"><span class="ico-slot" data-icon="seal" aria-hidden="true"></span><span data-i18n="seal.fileLabel"></span></label>
          <p id="seal-file-help" class="help small" data-i18n="seal.fileHelp"></p>
        </div>
        <div id="seal-preview" class="seal-preview" hidden>
          <img id="seal-img" alt="" width="64" height="64">
          <span id="seal-name"></span>
          <button type="button" id="seal-remove" class="btn btn-ghost" data-i18n="seal.remove"></button>
        </div>
        <div class="field">
          <label for="seal-pages" data-i18n="seal.pagesLabel"></label>
          <input type="text" id="seal-pages" inputmode="text" autocomplete="off" data-i18n-placeholder="seal.pagesPlaceholder" aria-describedby="seal-pages-help seal-pages-state">
          <p id="seal-pages-help" class="help small" data-i18n="seal.pagesHelp"></p>
          <p id="seal-pages-state" class="small"></p>
        </div>
        <div class="field">
          <label for="seal-pos" data-i18n="seal.posLabel"></label>
          <select id="seal-pos">
            <option value="br" data-i18n="seal.pos.br" selected></option>
            <option value="bl" data-i18n="seal.pos.bl"></option>
            <option value="tr" data-i18n="seal.pos.tr"></option>
            <option value="tl" data-i18n="seal.pos.tl"></option>
          </select>
        </div>
      </details>
      <div id="gen-reasons"></div>
      <div class="btn-row">
        <button type="button" id="btn-generate" class="btn btn-primary" aria-describedby="gen-reasons"><span class="ico-slot" data-icon="download" aria-hidden="true"></span><span data-i18n="gen.button"></span></button>
      </div>
      <div id="gen-result" role="status"></div>
    </section>
  </main>

  <footer class="wrap site-footer">
    <p>pdf-lib (MIT) · Hind Siliguri, Inter (SIL OFL)</p>
  </footer>

  <!-- pdf-lib 1.17.1 (MIT) is bundled in vendor/ so the app works even if the CDN is unreachable; the CDN is only a fallback. -->
  <script src="vendor/pdf-lib.min.js"></script>
  <script>
    if (!window.PDFLib) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
      document.head.appendChild(s);
    }
  </script>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
